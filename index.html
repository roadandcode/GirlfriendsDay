<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You 💖</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #290a2a 0%, #0d0417 60%, #05010a 100%);
      color: #f8f9fa;
      font-family: 'Cormorant Garamond', Georgia, serif;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeInUp 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .thank-you-title {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3, #ffb703);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 10px 25px rgba(255, 77, 109, 0.4));
      letter-spacing: 1px;
    }

    .sub-text {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #c8b6d6;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="thank-you-title">Thank You 💖</h1>
  </div>

</body>
</html>
